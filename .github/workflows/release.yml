name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version with git tag
        # Strip the leading 'v' (v2.4.0 -> 2.4.0) in the CI workspace only,
        # so zip filenames and the manifest version match the tag.
        run: pnpm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run compile

      - name: Unit tests
        run: pnpm test

      - name: Build extension zips (Chrome + Firefox)
        run: pnpm run zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*-chrome.zip
            dist/*-firefox.zip
            dist/*-sources.zip
